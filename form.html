<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD131 Product Review Form">
    <meta name="author" content="Macdonald Prince Yingura">

    <title>Product Review Form | WDD131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>

<form method="get" action="review.html">

    <!-- Product -->

    <fieldset>

        <legend>Product Information</legend>

        <div class="form-group">

            <label for="productName">
                Product Name
                <span class="required">*</span>
            </label>

            <select
                id="productName"
                name="productName"
                required>

                <option value="" disabled selected>
                    Select a Product ...
                </option>

            </select>

        </div>

    </fieldset>

    <!-- Rating -->

    <fieldset>

        <legend>
            Overall Rating
            <span class="required">*</span>
        </legend>

        <div class="rating">

            <input
                type="radio"
                id="star5"
                name="rating"
                value="5"
                required>

            <label for="star5">★</label>

            <input
                type="radio"
                id="star4"
                name="rating"
                value="4">

            <label for="star4">★</label>

            <input
                type="radio"
                id="star3"
                name="rating"
                value="3">

            <label for="star3">★</label>

            <input
                type="radio"
                id="star2"
                name="rating"
                value="2">

            <label for="star2">★</label>

            <input
                type="radio"
                id="star1"
                name="rating"
                value="1">

            <label for="star1">★</label>

        </div>

    </fieldset>

    <!-- Installation -->

    <fieldset>

        <legend>Installation</legend>

        <div class="form-group">

            <label for="installDate">
                Date of Installation
                <span class="required">*</span>
            </label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required>

        </div>

    </fieldset>

    <!-- Features -->

    <fieldset>

        <legend>Useful Features</legend>

        <div class="checkbox-group">

            <div>

                <input
                    type="checkbox"
                    id="durability"
                    name="features"
                    value="Durability">

                <label for="durability">
                    Durability
                </label>

            </div>

            <div>

                <input
                    type="checkbox"
                    id="ease"
                    name="features"
                    value="Ease of Use">

                <label for="ease">
                    Ease of Use
                </label>

            </div>

            <div>

                <input
                    type="checkbox"
                    id="performance"
                    name="features"
                    value="Performance">

                <label for="performance">
                    Performance
                </label>

            </div>

            <div>

                <input
                    type="checkbox"
                    id="design"
                    name="features"
                    value="Design">

                <label for="design">
                    Design
                </label>

            </div>

        </div>

    </fieldset>

    <!-- Review -->

    <fieldset>

        <legend>Written Review</legend>

        <div class="form-group">

            <label for="review">
                Your Review
            </label>

            <textarea
                id="review"
                name="review"
                rows="6"
                placeholder="Share your experience with this product..."></textarea>

        </div>

    </fieldset>

    <!-- User -->

    <fieldset>

        <legend>Your Information</legend>

        <div class="form-group">

            <label for="username">
                Your Name
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Optional">

        </div>

    </fieldset>

    <input
        type="submit"
        value="Submit Review"
        class="submit-btn">

</form>

</main>

<footer>

    <p>
        &copy;
        <span id="currentyear"></span>
        Macdonald Prince Yingura | Ghana
    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
